# SonarCloud analysis scope.
#
# What is analysed is the shipped application: the Python app and the browser
# extension itself. Build tooling, packaging scripts, benchmarks and
# test harnesses are deliberately out of scope - they never reach a user's
# machine, and holding a throwaway benchmark to the same bar as the download
# engine buries the findings that matter.
#
# .github/** is listed explicitly rather than left to sonar.sources: the
# GitHub Actions analyser scans workflows regardless of the source paths. The
# workflows are hardened separately (actions pinned to commit SHAs, contents:
# read by default with write only on the publishing job, build tools pinned) -
# what remains is the dependency-locking rule, which `pip install -e .` cannot
# satisfy without a lockfile the project does not keep.
sonar.sources=app,extension
sonar.tests=app/tests

# Pin the language level. Without it the Python analyser assumes it may be
# running on an old interpreter and reports ssl.create_default_context() as a
# weak-protocol risk (S4423) - a false positive: GrabLine requires 3.12, where
# that call is TLS 1.2+ with verification on. Matches requires-python in
# pyproject.toml; keep the two in step.
sonar.python.version=3.12

sonar.exclusions=\
  .github/**,\
  build/**,\
  dist/**,\
  .venv/**,\
  node_modules/**,\
  scripts/**,\
  packaging/**,\
  website/**,\
  docs/**,\
  extension/test/**,\
  app/ui/assets/**,\
  app/i18n/**

sonar.python.file.suffixes=.py
sonar.sourceEncoding=UTF-8

# Deliberate product behaviour, reviewed and kept. Suppressed here rather than
# inline so the reason lives somewhere a reviewer will actually look, and so it
# cannot be silently widened by an editor's autocomplete.
#
# S5332 (plain ftp://): GrabLine supports ftp:// because people have servers
# that speak nothing else. It is chosen per URL by the user, never substituted
# for ftps:// behind their back, and ftps:// beside it gets a verified TLS
# channel from the same factory the rest of the app uses.
sonar.issue.ignore.multicriteria=ftp
sonar.issue.ignore.multicriteria.ftp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.ftp.resourceKey=app/engines/cloud.py
