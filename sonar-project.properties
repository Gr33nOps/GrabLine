# SonarCloud analysis scope.
#
# What is analysed is the shipped application: the Python app and the browser
# extension itself. Build tooling, packaging scripts, benchmarks and
# test harnesses are deliberately out of scope - they never reach a user's
# machine, and holding a throwaway benchmark to the same bar as the download
# engine buries the findings that matter.
sonar.sources=app,extension
sonar.tests=app/tests

# Pin the language level. Without it the Python analyser assumes it may be
# running on an old interpreter and reports ssl.create_default_context() as a
# weak-protocol risk (S4423) - a false positive: GrabLine requires 3.12, where
# that call is TLS 1.2+ with verification on. Matches requires-python in
# pyproject.toml; keep the two in step.
sonar.python.version=3.12

sonar.exclusions=\
  build/**,\
  dist/**,\
  .venv/**,\
  node_modules/**,\
  scripts/**,\
  packaging/**,\
  website/**,\
  docs/**,\
  extension/test/**,\
  app/ui/assets/**,\
  app/i18n/**

sonar.python.file.suffixes=.py
sonar.sourceEncoding=UTF-8
