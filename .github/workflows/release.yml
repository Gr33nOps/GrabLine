name: Release

# Build the desktop installers for Windows, macOS, and Linux on native
# runners, and (on a version tag) attach them to a GitHub Release.
#
#   git tag v1.3.5 && git push origin v1.3.5      # -> builds + publishes
#   or run manually from the Actions tab           # -> builds artifacts only
#
# Installers are UNSIGNED: Windows SmartScreen and macOS Gatekeeper will warn
# on first launch. Signing needs paid certificates and can be added later.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege at the top: the build jobs only need to read the repository.
# The one job that creates a release raises its own permission below.
permissions:
  contents: read

# Use bash on every runner (Windows included) so steps behave identically and
# don't hit PowerShell's error-handling quirks.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
            mac_arch: applesilicon
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Linux system libraries (Qt icon render + libs bundled into the app)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-util1 libxcb-xkb1

      - name: Install app and build tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          # Pinned: the frozen binary is a product of these tools, so leaving
          # them floating means the same tag can build differently next month.
          # Bump deliberately, in a commit, not by the calendar.
          pip install "pyinstaller==6.22.3" "pillow==12.3.0"

      - name: Record the exact build inputs
        shell: bash
        run: |
          # Attached to the release, so a rebuild can be compared against what
          # actually shipped instead of guessed at.
          python -m pip freeze --all > "dist-requirements-${{ matrix.os }}.txt" || true
          mkdir -p dist
          mv "dist-requirements-${{ matrix.os }}.txt" dist/ || true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(python -c 'import app; print(app.__version__)')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building Grabline $V"

      - name: Render icons
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_icons.py

      - name: Build macOS .icns
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/grabline.iconset -o packaging/grabline.icns

      - name: Freeze with PyInstaller
        run: pyinstaller packaging/grabline.spec --noconfirm --distpath dist --workpath build

      - name: Package Windows installer + portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          choco install innosetup --no-progress -y
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "//DAppVersion=$V" \
            packaging/windows/grabline.iss
          # Portable: the same bundle, zipped, for USB sticks and machines
          # where the user has no administrator rights.
          cp packaging/windows/PORTABLE-README.txt dist/grabline/README.txt
          (cd dist && powershell -NoProfile -Command \
            "Compress-Archive -Path grabline -DestinationPath Grabline-$V-windows-portable.zip -Force")
          echo "built dist/Grabline-$V-windows-portable.zip"

      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.mac_arch }}"
          STAGE=dist/dmg
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          test -d dist/Grabline.app
          cp -R dist/Grabline.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          OUT="dist/Grabline-$V-$ARCH.dmg"
          rm -f "$OUT"
          # Build the final compressed image in one shot. The old UDRW → attach
          # → Finder layout → convert pipeline is what failed on macos-latest
          # (Apple Silicon): attach/detach races leave the volume busy and the
          # convert step exits 1 with no usable .dmg. A plain UDZO from the
          # folder is what every other open-source mac app ships from CI, and
          # users still drag Grabline.app onto Applications themselves.
          hdiutil create \
            -volname Grabline \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "$OUT"
          test -f "$OUT"
          echo "built $OUT ($(du -h "$OUT" | awk '{print $1}'))"

      - name: Package Linux AppImage + tarball + .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          bash packaging/linux/build_appimage.sh "$V"   # also bundles Qt/xcb libs into dist/grabline
          # A plain tarball for anyone whose system lacks FUSE (Mint/Ubuntu ship
          # FUSE3, AppImages want FUSE2): extract and run ./grabline/grabline.
          tar -C dist -czf "dist/Grabline-$V-linux-x86_64.tar.gz" grabline
          echo "built dist/Grabline-$V-linux-x86_64.tar.gz"
          # .deb for Debian/Ubuntu/Mint: menu entry, icons and a launcher on
          # PATH, removable with apt.
          bash packaging/linux/build_deb.sh "$V"

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # One artifact per matrix entry, keyed by its runner OS.
          name: grabline-${{ matrix.os }}
          path: |
            dist/Grabline-Setup-*.exe
            dist/Grabline-*-windows-portable.zip
            dist/Grabline-*.dmg
            dist/Grabline-*-x86_64.AppImage
            dist/Grabline-*-linux-x86_64.tar.gz
            dist/grabline_*_amd64.deb
            dist/dist-requirements-*.txt
          if-no-files-found: error

  release:
    # Every platform build must succeed. This used to be `always()`, which let
    # the release publish when a leg had failed - so a tag could end up with,
    # say, no macOS .dmg, and the website's download button pointed at a
    # release that silently had nothing for that platform. A missing installer
    # is a failed release, not a partial one: fix the build and re-tag.
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    permissions:
      contents: write # only this job creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Verify every expected installer is present
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          missing=0
          # One entry per artifact the release promises. A glob that matches
          # nothing means that platform's installer is not in this release.
          for pattern in \
            "artifacts/*/Grabline-Setup-$V.exe" \
            "artifacts/*/Grabline-$V-windows-portable.zip" \
            "artifacts/*/Grabline-$V-"*.dmg \
            "artifacts/*/Grabline-$V-x86_64.AppImage" \
            "artifacts/*/Grabline-$V-linux-x86_64.tar.gz" \
            "artifacts/*/grabline_${V}_amd64.deb"
          do
            # shellcheck disable=SC2086
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::missing release asset: $pattern"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All expected installers are present."

      - name: Publish SHA256SUMS alongside the installers
        run: |
          set -euo pipefail
          # So anyone can verify a download, and so the updater's digest check
          # has a second, human-checkable source.
          ( cd artifacts && find . -type f ! -name 'SHA256SUMS*' -printf '%P\n' \
              | sort | xargs -r sha256sum ) > SHA256SUMS.txt
          mkdir -p artifacts/checksums && mv SHA256SUMS.txt artifacts/checksums/
          cat artifacts/checksums/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
