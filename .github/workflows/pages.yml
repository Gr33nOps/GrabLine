name: Pages

# Deploys the website/ landing page to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The site then publishes on every push to main.

# No paths filter: main is rebuilt as a single amended commit and
# force-pushed on release, and GitHub can't diff a rewritten ref - a paths
# filter silently skips the run (the site never updated after the first
# deploy). Main only moves on release, so this is ~one deploy per release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel an in-flight deploy: cancel-in-progress
# left 1.29.10 stuck in waiting/queued until deploy-pages hit its ~10m timeout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pre-fetch the latest release into a static file the page reads at
      # runtime, instead of every visitor's browser calling the GitHub REST
      # API directly. That endpoint's 60/hour anonymous limit is shared per
      # IP - visitors behind one (an office, a university, mobile carrier
      # NAT) would routinely exhaust it and fall back to a generic "Latest
      # release" notice. One authenticated call here, once per release
      # (main only moves on release), avoids that entirely.
      - name: Fetch latest release info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSL --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq '{tag_name, assets: [.assets[] | {name, browser_download_url}]}' \
            > website/latest.json
          cat website/latest.json
      # Pages must be enabled once in Settings → Pages → Source: GitHub Actions.
      # GITHUB_TOKEN cannot create the site (Resource not accessible by integration).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
