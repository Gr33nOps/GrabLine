name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing in CI writes to the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Apt mirrors and a hung test must not burn a runner for half an hour+.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (offscreen) and FFmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Bounded apt: stuck mirrors were holding the whole job for 30+ minutes.
          sudo apt-get \
            -o Acquire:Retries=3 \
            -o Acquire:http:Timeout=30 \
            -o Acquire:https:Timeout=30 \
            -o Acquire:ftp:Timeout=30 \
            update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire:Retries=3 \
            -o Acquire:http:Timeout=30 \
            -o Acquire:https:Timeout=30 \
            install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 ffmpeg

      # SonarCloud flags these pip lines (S8541 wants --only-binary :all:,
      # which forbids the build an editable install performs; S8544 wants a
      # resolved lockfile this project does not keep). Neither an inline
      # NOSONAR nor sonar-project.properties suppresses them - automatic
      # analysis honours neither for the Actions analyser - so they have to be
      # accepted in the SonarCloud UI. What IS pinned: every Action is a commit
      # SHA, the release build tools are exact versions, and each release
      # attaches the pip freeze of the environment that built it.
      - name: Install project
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "Shell-surface gate (S1: no shell=True anywhere)"
        run: |
          if grep -rn --include='*.py' 'shell=True' app packaging extension 2>/dev/null; then
            echo ":error:shell=True is forbidden by security requirement S1"
            exit 1
          fi
          echo "S1 gate passed"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, strict on core)
        timeout-minutes: 5
        run: mypy app

      - name: Tests (segmenter, resume, kill -9 milestone)
        timeout-minutes: 12
        run: pytest --timeout=90 --timeout-method=thread -m "not network"
        env:
          QT_QPA_PLATFORM: offscreen

  # The full suite runs on Linux above. This second job runs the
  # platform-sensitive parts on Windows and macOS, because building for a
  # platform is not the same as having run anything on it: path handling,
  # reserved filenames, subprocess/startupinfo behaviour, the reveal-in-folder
  # opener, the updater's architecture matching and the keyring backend all
  # differ per OS and were only ever exercised on Ubuntu. Deliberately a
  # subset - the network-heavy engine tests are slow and OS-independent.
  platforms:
    name: platform checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install project
        timeout-minutes: 10
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Platform-sensitive tests
        timeout-minutes: 12
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --timeout=90 --timeout-method=thread -m "not network" \
            app/tests/test_paths.py \
            app/tests/test_naming.py \
            app/tests/test_reveal.py \
            app/tests/test_update.py \
            app/tests/test_security_review.py \
            app/tests/test_settings.py \
            app/tests/test_db.py \
            app/tests/test_instance.py
